# FLOW — configuration psmux portable
# Chargée par FLOW.ps1 avec : psmux -L flow -f config\psmux.conf
# (serveur isolé « flow » : n'interfère pas avec tes autres sessions psmux)

# Souris, numérotation, historique
set -g mouse on
set -g base-index 1
set -g history-limit 20000

# Couleurs : ne jamais hériter de NO_COLOR (posé par les shells de Claude Code)
set-environment -g -u NO_COLOR
set-environment -g -u GIT_TERMINAL_PROMPT

# Barre d'état
set -g status-position bottom
set -g status-style "bg=#1a1b26,fg=#a9b1d6"
set -g status-left " ◆ FLOW · #S "
set -g status-left-style "bg=#ff8a5c,fg=#1a1b26,bold"
set -g status-left-length 40
# à droite : limites des comptes Claude (écrites par le moniteur dans @flow_status), puis l'heure
set -g status-right " #{?#{@flow_status},#{@flow_status} │ ,}%H:%M "
set -g status-right-length 100
set -g status-right-style "bg=#a870ff,fg=#1a1b26,bold"
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g window-status-style "fg=#565f89"
set -g window-status-current-style "bg=#54baff,fg=#1a1b26,bold"
set -g window-status-separator ""

# Bordures et messages
set -g pane-border-style "fg=#3b3f5c"
set -g pane-active-border-style "fg=#ff8a5c"
set -g message-style "bg=#a870ff,fg=#1a1b26"
set -g mode-style "bg=#54baff,fg=#1a1b26"

# Titre de chaque panneau (rôle posé par FLOW dans @flow_role, état de Claude ajouté par le moniteur)
# vert = Claude a fini et attend ta réponse · orange = panneau actif · gris = autres
set -g pane-border-status top
set -g pane-border-format "#{?#{==:#{@flow_state},done},#[fg=#60e8c4 bold],#{?pane_active,#[fg=#ff8a5c bold],#[fg=#565f89]}} #{?#{@flow_role},#{@flow_role},#{pane_current_command}} "

# Découpes intuitives (préfixe + | / préfixe + -)
bind-key -T prefix | split-window -h
bind-key -T prefix - split-window -v

# Retour au sélecteur FLOW (la session continue de tourner) : préfixe + f (en plus de préfixe + d)
bind-key -T prefix f detach-client

# Sans préfixe : Alt+flèches = changer de panneau, Alt+z = agrandir / rétablir le panneau
bind-key -n M-Left  select-pane -L
bind-key -n M-Right select-pane -R
bind-key -n M-Up    select-pane -U
bind-key -n M-Down  select-pane -D
bind-key -n M-z     resize-pane -Z
