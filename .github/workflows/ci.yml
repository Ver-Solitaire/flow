name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Analyse syntaxique et tests (Pester)
        shell: pwsh
        run: ./tests/run.ps1

      - name: Compilation de FLOW.exe
        shell: pwsh
        run: |
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          & $csc /nologo /target:winexe /out:FLOW.exe /r:System.Web.Extensions.dll /r:System.Windows.Forms.dll /r:System.Drawing.dll app\FlowApp.cs
          if ($LASTEXITCODE -ne 0) { exit 1 }

  installateur:
    runs-on: windows-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - name: Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Compilation de l'installateur
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=$v" installer\FLOW.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: FLOW-Setup
          path: installer/sortie/*.exe