name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Analyse syntaxique et tests (Pester)
        shell: pwsh
        run: ./tests/run.ps1

      - name: Compilation de FLOW.exe
        shell: pwsh
        run: |
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          & $csc /nologo /target:winexe /out:FLOW.exe /r:System.Web.Extensions.dll /r:System.Windows.Forms.dll /r:System.Drawing.dll app\FlowApp.cs
          if ($LASTEXITCODE -ne 0) { exit 1 }
